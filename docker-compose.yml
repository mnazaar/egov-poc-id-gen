name: idgen

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idgen
      POSTGRES_USER: idgen
      POSTGRES_PASSWORD: idgen
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idgen -d idgen"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: .
    # Published as nazaarblue/idgen on Docker Hub, but compose always builds from source
    # (pull_policy: build), so a fresh clone never depends on the registry.
    image: nazaarblue/idgen:1.0.0
    pull_policy: build
    environment:
      DB_URL: postgresql://postgres:5432/idgen
      DB_USER: idgen
      DB_PASSWORD: idgen
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 3
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  loadtest:
    image: python:3.12-slim
    profiles: [test]
    working_dir: /loadtest
    volumes:
      - ./loadtest:/loadtest
    environment:
      TARGET: http://nginx:8080
    depends_on:
      - nginx
    command: ["python", "loadtest.py"]

  jmeter:
    build: ./loadtest/jmeter
    profiles: [jmeter]
    working_dir: /jmeter
    volumes:
      - ./loadtest:/jmeter
    depends_on:
      - nginx
    command: ["-n", "-t", "idgen.jmx", "-Jhost=nginx", "-Jport=8080",
              "-l", "out/jmeter/results.jtl", "-e", "-o", "out/jmeter/report", "-f"]
