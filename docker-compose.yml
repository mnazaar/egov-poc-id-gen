name: idgen

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idgen
      POSTGRES_USER: idgen
      POSTGRES_PASSWORD: idgen
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idgen -d idgen"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: .
    image: ${DOCKERHUB_USER:-local}/idgen:1.0.0
    environment:
      DB_URL: postgresql://postgres:5432/idgen
      DB_USER: idgen
      DB_PASSWORD: idgen
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 3
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  loadtest:
    image: python:3.12-slim
    profiles: [test]
    working_dir: /loadtest
    volumes:
      - ./loadtest:/loadtest
    environment:
      TARGET: http://nginx:8080
    depends_on:
      - nginx
    command: ["python", "loadtest.py"]
